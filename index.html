        <div class="step reveal"><span>04</span><div><h3>You review it</h3><p>You see the work, give feedback, and we refine the important details together.</p></div></div>
        <div class="step reveal"><span>05</span><div><h3>We launch</h3><p>Once everything is ready, your new website goes live.</p></div></div>

    <section class="faq section-pad" id="faq"><div class="eyebrow">08 / FAQ</div><div class="faq-grid"><div><h2>Questions,<br /><em>answered.</em></h2></div><div class="accordion">
      <details open><summary>Do I need to know anything about websites?<span>+</span></summary><p>No. We handle the technical side. We first understand your business and what you want the website to do.</p></details>
      <details><summary>Can my website sell products?<span>+</span></summary><p>Yes. Online ordering and ecommerce functionality are available depending on what your business needs.</p></details>
      <details><summary>Can I see examples?<span>+</span></summary><p>Yes. Explore the live demonstrations in our work section to see different types of websites we can build.</p></details>
      <details><summary>Do I have to choose a package immediately?<span>+</span></summary><p>No. The packages are starting points. We'll discuss your requirements before development begins.</p></details>
      <details><summary>Can you make a website for my specific business?<span>+</span></summary><p>Yes. First Draft Studio builds custom websites around the business and its goals.</p></details>
    </div></div></section>

    <section class="contact section-pad" id="contact"><div class="contact-shell"><div class="contact-intro"><div class="eyebrow">09 / START A CONVERSATION</div><h2>Let's turn your<br /><em>idea into a site.</em></h2><p>Tell us a little about your business. We'll talk through what you need before anything is built.</p><div class="contact-note">No checkout.<br />No automatic package order.<br />Just a conversation.</div></div><form id="inquiry-form" class="inquiry-form"><div class="form-row"><label>Name<input name="name" required autocomplete="name" placeholder="Your name" /></label><label>Business name<input name="business" required placeholder="Your business" /></label></div><div class="form-row"><label>Contact information<input name="contact" required placeholder="Phone, WhatsApp or email" /></label><label>Website type<select name="type"><option>Business website</option><option>Online store</option><option>Custom website</option><option>Not sure yet</option></select></label></div><label>What does your business do?<textarea name="about" rows="3" required placeholder="Tell us a little about it..."></textarea></label><label>What should the website achieve?<textarea name="goal" rows="3" placeholder="More enquiries, showcase products, online ordering, etc."></textarea></label><div class="form-row"><label>Package you're considering<select name="package"><option>Not sure yet</option><option>₹3,000</option><option>₹5,000</option><option>₹10,000</option><option>₹20,000</option></select></label><label>Online ordering?<select name="ordering"><option>No</option><option>Yes, tell me more</option><option>I'm not sure</option></select></label></div><label>Anything else?<textarea name="message" rows="3" placeholder="Anything you'd like us to know..."></textarea></label><button class="button button-dark submit-btn" type="submit">Send inquiry <span>↗</span></button><p class="form-footnote">This is an inquiry form. It does not charge you or automatically place a website order.</p><span class="form-footnote">By submitting details, you acknowledge the <a href="./privacy.html" target="_blank" rel="noopener">Privacy Policy</a>. See <a href="./service-delivery.html">Service & Delivery</a> and <a href="./contact-grievance.html">Contact & Grievance</a>.</span><div class="form-success" role="status" aria-live="polite"><strong>Thanks. We've received your message.</strong><span>We'll get back to you to discuss your business and what you'd like to build.</span></div></form></div></section>
